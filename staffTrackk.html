<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DelivaX - Staff Order List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-white min-h-screen">

    <header class="py-6 text-center">
        <h1 class="text-4xl font-bold text-[#0047AB]">Order</h1>
    </header>

    <nav class="bg-gray-500 p-4 flex justify-between items-center text-white px-6">
        <div class="flex items-center space-x-6">
            <i data-lucide="menu" class="w-6 h-6 cursor-pointer"></i>
        </div>
        <div class="flex items-center space-x-6">
            <i data-lucide="bell" class="w-6 h-6 cursor-pointer"></i>
            <i data-lucide="share-2" class="w-6 h-6 cursor-pointer"></i>
            <div class="bg-blue-600 p-1 rounded-full">
                <i data-lucide="user" class="w-6 h-6"></i>
            </div>
        </div>
    </nav>

    <main class="p-6 space-y-12 mt-4 max-w-md mx-auto">

        <div class="relative bg-[#C2E7FF] rounded-2xl p-6 shadow-sm">
            <img src="https://www.rotinrice.com/wp-content/uploads/2012/05/NasiGoreng-1.jpg" 
                 alt="Fried Rice" 
                 class="absolute -top-10 -right-4 w-32 h-32 object-cover rounded-full border-4 border-white shadow-lg">
            
            <div class="space-y-1 pr-20">
                <h3 class="font-bold text-lg">#10001</h3>
                <p class="font-bold">Fried rice x2</p>
                <p class="text-gray-800">Jackson Wong</p>
                <p class="text-gray-800">019-xxx1726</p>
                <p class="text-sm text-gray-700 leading-tight">xx, Taman xxxx ,32400 xxxx</p>
                <p class="font-bold pt-2">Delivered</p>
            </div>
        </div>

        <div class="relative bg-[#C2E7FF] rounded-2xl p-6 shadow-sm">
            <img src="https://asianfoodnetwork.com/content/dam/afn/global/en/recipes/mee-goreng-mamak/AFN_mee_goreng_mamak_main_image.jpg" 
                 alt="Fried Noodle" 
                 class="absolute -top-10 -right-4 w-32 h-32 object-cover rounded-full border-4 border-white shadow-lg">
            
            <div class="space-y-1 pr-20">
                <h3 class="font-bold text-lg">#10002</h3>
                <p class="font-bold">Fried noodle x3</p>
                <p class="text-gray-800">Nurul Syahida binti Abu Bakar</p>
                <p class="text-gray-800">018-xxx1726</p>
                <p class="text-sm text-gray-700 leading-tight">xx, Taman xxxx ,32400 xxxx</p>
                <p class="font-bold pt-2">Cancelled</p>
            </div>
        </div>

    </main>

    <script>
        // Initialize icons
        lucide.createIcons();
    </script>
</body>
</html>
