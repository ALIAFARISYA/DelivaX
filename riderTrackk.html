<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CraveRoute Dashboard - Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght=400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body x-data="{ step: 1 }" x-init="lucide.createIcons(); $watch('step', value => $nextTick(() => lucide.createIcons()))">

    <div class="flex min-h-screen">
        <!-- SIDEBAR -->
        <aside class="w-64 bg-[#0047AB] text-white flex flex-col">
            <div class="p-6">
                <h1 class="text-2xl font-bold tracking-tighter italic">CraveRoute Admin</h1>
            </div>
            <nav class="flex-1 px-4 space-y-2 mt-4">
                <button @click="step = 1" :class="step === 1 ? 'bg-blue-800' : ''" class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-blue-700 transition">
                    <i data-lucide="layout-dashboard"></i> <span>New Orders</span>
                </button>
                <button @click="step = 2" :class="step === 2 ? 'bg-blue-800' : ''" class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-blue-700 transition">
                    <i data-lucide="package"></i> <span>Pick Up Prep</span>
                </button>
                <button @click="step = 3" :class="step === 3 ? 'bg-blue-800' : ''" class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-blue-700 transition">
                    <i data-lucide="truck"></i> <span>Active Delivery</span>
                </button>
                <button @click="step = 4" :class="step === 4 ? 'bg-blue-800' : ''" class="w-full flex items-center space-x-3 p-3 rounded-lg hover:bg-blue-700 transition">
                    <i data-lucide="check-circle"></i> <span>Completion</span>
                </button>
            </nav>
            <div class="p-4 border-t border-blue-400 text-xs text-blue-200">
                Staff ID: #ST-9902
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 flex flex-col">
            <!-- TOP NAV -->
            <header class="bg-white shadow-sm p-4 flex justify-between items-center px-10">
                <h2 class="text-xl font-bold text-gray-700" x-text="step === 1 ? 'Dispatch Center' : (step === 2 ? 'Kitchen / Pick Up' : (step === 3 ? 'Rider Tracking' : 'Drop-off Confirmation'))"></h2>
                <div class="flex items-center space-x-6">
                    <i data-lucide="bell" class="text-gray-400 cursor-pointer"></i>
                    <div class="flex items-center space-x-2">
                        <span class="text-sm font-medium">Restoran Ali</span>
                        <div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center"><i data-lucide="user" class="w-4"></i></div>
                    </div>
                </div>
            </header>

            <div class="p-10 flex justify-center">
                
                <!-- CONTAINER BOARD -->
                <div class="bg-white w-full max-w-5xl rounded-3xl shadow-xl overflow-hidden min-h-[600px] flex">
                    
                    <!-- LEFT PANEL: MAPS / INFO (Fixed 404 Error URL) -->
                    <div class="w-1/2 bg-gray-100 relative overflow-hidden flex flex-col">
                        <div class="absolute inset-0 opacity-40 bg-[url('https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=800&q=80')] bg-cover bg-center"></div>
                        <div class="relative z-10 p-6 h-full flex flex-col justify-between">
                            <div class="bg-white/90 p-4 rounded-2xl shadow-sm border border-blue-100">
                                <h4 class="font-bold text-[#0047AB]">Order Route Info</h4>
                                <p class="text-xs text-gray-500">Destinasi: Lot 45, Jalan Mawar, Terengganu</p>
                            </div>
                            <div class="flex justify-center">
                                <div class="bg-blue-600 text-white px-6 py-2 rounded-full text-sm font-bold animate-bounce shadow-lg">
                                    Live Tracker Active
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- RIGHT PANEL: DETAILS -->
                    <div class="w-1/2 p-8 overflow-y-auto">
                        
                        <!-- STEP 1: ACCEPTANCE -->
                        <template x-if="step === 1">
                            <div class="space-y-6">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h1 class="text-3xl font-black text-blue-900">#3001</h1>
                                        <p class="text-gray-400">Order Masuk: 2 minit lepas</p>
                                    </div>
                                    <span class="bg-green-100 text-green-600 px-3 py-1 rounded-full text-xs font-bold uppercase">New Order</span>
                                </div>
                                <div class="space-y-4 border-y py-6">
                                    <div class="flex items-center gap-4"><i data-lucide="shopping-cart"></i> <span>2 Food, 2 Drinks</span></div>
                                    <div class="flex items-center gap-4"><i data-lucide="navigation"></i> <span>Distance: 1.7km (8 min)</span></div>
                                </div>
                                <div class="flex gap-4">
                                    <button @click="step = 2" class="flex-1 bg-[#C2E7FF] text-blue-800 font-bold py-4 rounded-2xl hover:bg-blue-200 transition">Accept Order</button>
                                    <button class="bg-gray-100 px-8 rounded-2xl text-gray-400"><i data-lucide="trash-2"></i></button>
                                </div>
                            </div>
                        </template>

                        <!-- STEP 2: PICK UP -->
                        <template x-if="step === 2">
                            <div class="space-y-6">
                                <div class="bg-[#C2E7FF] p-4 rounded-xl flex items-center gap-3">
                                    <i data-lucide="clock" class="text-blue-800"></i>
                                    <span class="font-bold text-blue-800">Ready in 5 minutes</span>
                                </div>
                                <div class="border rounded-2xl p-6 bg-gray-50">
                                    <h3 class="font-bold text-lg mb-4">s1oj-vfer (#3001)</h3>
                                    <div class="space-y-3">
                                        <div class="flex justify-between font-medium"><span>2x Nasi Goreng Kampung</span><span>RM 12.00</span></div>
                                        <div class="flex justify-between font-medium"><span>2x Milo Ais</span><span>RM 8.00</span></div>
                                    </div>
                                </div>
                                <div class="border-2 border-dashed border-blue-200 p-6 rounded-2xl flex items-center justify-between">
                                    <p class="text-sm">Scan Resit / Ambil Gambar</p>
                                    <button class="bg-blue-500 text-white p-3 rounded-lg"><i data-lucide="camera"></i></button>
                                </div>
                                <button @click="step = 3" class="w-full bg-[#0047AB] text-white font-bold py-4 rounded-2xl shadow-lg">Confirm Ready for Pick-up</button>
                            </div>
                        </template>

                        <!-- STEP 3: RIDER MODE -->
                        <template x-if="step === 3">
                            <div class="space-y-6">
                                <div class="flex items-center gap-4">
                                    <div class="w-16 h-16 bg-gray-300 rounded-full flex items-center justify-center text-gray-500"><i data-lucide="user" class="w-8 h-8"></i></div>
                                    <div>
                                        <h3 class="font-bold text-xl">Mohd Abu (Rider)</h3>
                                        <p class="text-blue-500">Sedang ke destinasi...</p>
                                    </div>
                                </div>
                                <div class="bg-blue-50 p-6 rounded-2xl">
                                    <p class="text-xs uppercase font-bold text-gray-400">Total Collection</p>
                                    <h2 class="text-4xl font-black text-blue-900 mt-2">RM 20.00</h2>
                                    <p class="text-sm text-blue-700 mt-1">Sila kutip cash daripada pelanggan</p>
                                </div>
                                <button @click="step = 4" class="w-full bg-blue-100 text-blue-700 font-bold py-4 rounded-2xl border-2 border-blue-300">Rider Arrived at Customer</button>
                            </div>
                        </template>

                        <!-- STEP 4: COMPLETION -->
                        <template x-if="step === 4">
                            <div class="text-center space-y-6 py-10">
                                <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto">
                                    <i data-lucide="check" class="w-10 h-10"></i>
                                </div>
                                <h2 class="text-2xl font-bold">Delivery Success!</h2>
                                <p class="text-gray-500">Order #3001 telah dihantar & bayaran diterima.</p>
                                <button @click="step = 1" class="bg-[#0047AB] text-white px-10 py-4 rounded-2xl font-bold">Back to Dashboard</button>
                            </div>
                        </template>

                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
