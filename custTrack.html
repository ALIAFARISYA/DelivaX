<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>DelivaX - Track Order</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-white p-6 flex flex-col items-center justify-center min-h-screen">
    
    <div class="w-full max-w-sm text-center">
        <h2 class="text-2xl font-bold text-[#0047AB] mb-2">Track Your Order</h2>
        <p class="text-gray-400 text-sm mb-8">Order ID: #DX99012</p>

        <div class="bg-blue-50 p-6 rounded-2xl mb-8">
            <p class="text-gray-500 text-xs uppercase font-bold tracking-widest">Estimated Arrival</p>
            <h1 class="text-5xl font-black text-[#0047AB] mt-2">15-25</h1>
            <p class="text-[#0047AB] font-bold">MINUTES</p>
        </div>

        <div class="space-y-6 text-left">
            <div class="flex items-center space-x-4">
                <div class="w-4 h-4 bg-blue-600 rounded-full"></div>
                <p class="text-blue-600 font-bold">Order Received</p>
            </div>
            <div class="flex items-center space-x-4">
                <div class="w-4 h-4 bg-blue-600 rounded-full animate-pulse"></div>
                <p class="text-blue-600 font-bold">Preparing your meal...</p>
            </div>
            <div class="flex items-center space-x-4 opacity-30">
                <div class="w-4 h-4 bg-gray-400 rounded-full"></div>
                <p class="text-gray-500 font-bold">On the way (Rider: Ali)</p>
            </div>
            <div class="flex items-center space-x-4 opacity-30">
                <div class="w-4 h-4 bg-gray-400 rounded-full"></div>
                <p class="text-gray-500 font-bold">Delivered</p>
            </div>
        </div>

        <button onclick="window.location.href='index.html'" class="mt-12 text-gray-400 underline text-sm">Cancel Order</button>
    </div>

</body>
</html>
